<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" fill="none" role="img" aria-label="Athenaeum Central Library Logo">
  <!-- Symbol: Open Book with Arch & Star of Knowledge -->
  <g transform="translate(4, 4)">
    <!-- Shield / Arch outline -->
    <path d="M22 2 C32 2 40 8 40 18 C40 32 22 42 22 42 C22 42 4 32 4 18 C4 8 12 2 22 2Z" fill="#0f1e36" stroke="#c59b27" stroke-width="1.8"/>
    <!-- Book pages left -->
    <path d="M22 34 C18 31 11 30 7 32 L7 16 C11 14 18 15 22 18 Z" fill="#fdfbf7" stroke="#c59b27" stroke-width="1.2"/>
    <!-- Book pages right -->
    <path d="M22 34 C26 31 33 30 37 32 L37 16 C33 14 26 15 22 18 Z" fill="#fdfbf7" stroke="#c59b27" stroke-width="1.2"/>
    <!-- Center spine -->
    <line x1="22" y1="18" x2="22" y2="34" stroke="#c59b27" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Torch / Star of enlightenment above book -->
    <polygon points="22,7 24,11 28,11 25,13.5 26,17 22,14.5 18,17 19,13.5 16,11 20,11" fill="#d4af37"/>
  </g>
  <!-- Typography -->
  <text x="56" y="24" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="19" font-weight="700" letter-spacing="1.5" fill="#0f1e36">ATHENAEUM</text>
  <text x="56.5" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3" fill="#c59b27">CENTRAL LIBRARY</text>
</svg>
